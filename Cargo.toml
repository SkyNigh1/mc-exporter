[package]
name = "mc-exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
eframe = "0.35.0"
fastnbt = "2.6.3"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
